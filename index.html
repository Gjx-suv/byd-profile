<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>The Pulse of Cycles</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      #scene {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #scene::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 52%, rgba(40, 82, 156, 0.22), rgba(0, 0, 0, 0.95) 60%);
        mix-blend-mode: screen;
      }



      #poem-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 6px;
        color: rgba(228, 238, 255, 0.92);
        font-size: clamp(18px, 2.2vw, 32px);
        letter-spacing: 0.08em;
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        transition: opacity 480ms ease, transform 620ms cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
        text-shadow: 0 0 22px rgba(116, 178, 255, 0.35);
        z-index: 4;
      }

      #poem-overlay.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      #poem-overlay p {
        margin: 0;
      }

      .hint {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 5;
        padding: 10px 14px;
        border: 1px solid rgba(130, 176, 255, 0.34);
        border-radius: 999px;
        background: rgba(7, 9, 15, 0.52);
        color: rgba(219, 232, 255, 0.9);
        font-size: 12px;
        letter-spacing: 0.03em;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="poem-overlay" aria-hidden="true">
      <p>时间把晨昏折成一枚硬币，</p>
      <p>抛向每一次繁荣与回落；</p>
      <p>我们在噪声里追问方向，</p>
      <p>直到数据也学会了心跳。</p>
      <p>此刻，代码不是答案，</p>
      <p>而是黑夜里发光的潮汐。</p>
    </div>
    <div class="hint">点击任意处开启音效，悬停球体让诗句清晰浮现</div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
