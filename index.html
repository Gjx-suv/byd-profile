<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Pulse of Cycles</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #000000;
      }

      #scene {
        width: 100%;
        height: 100%;
      }

      .hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 5;
        color: rgba(255, 255, 255, 0.9);
        pointer-events: none;
      }

      .hud h1 {
        margin: 0;
        font-size: clamp(22px, 2.7vw, 42px);
        letter-spacing: 0.08em;
        font-weight: 600;
      }

      .hud p {
        margin: 8px 0 0;
        max-width: min(480px, 75vw);
        line-height: 1.6;
        font-size: clamp(13px, 1.25vw, 18px);
        color: rgba(196, 214, 255, 0.75);
      }

      .hint {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 5;
        padding: 10px 14px;
        border: 1px solid rgba(140, 182, 255, 0.35);
        border-radius: 12px;
        background: rgba(7, 10, 18, 0.56);
        color: rgba(224, 234, 255, 0.92);
        font-size: 13px;
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>

    <div class="hud">
      <h1>The Pulse of Cycles</h1>
      <p>
        把宏观经济的枯燥数据，用前端视角重新解构。代码是理性的，但周期是感性的。
        熬了两个大夜，终于让数据“呼吸”了起来。
      </p>
    </div>

    <div class="hint">移动鼠标环视，悬停到球体上让它散成一首关于时间的诗。</div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
