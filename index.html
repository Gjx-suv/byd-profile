<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第三人称射击打靶游戏</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        color: #fff;
        background: rgba(10, 10, 10, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.5;
        z-index: 10;
        user-select: none;
      }

      #start-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        z-index: 20;
        text-align: center;
        cursor: pointer;
      }

      #start-overlay.hidden {
        display: none;
      }

      .panel {
        background: rgba(20, 20, 20, 0.9);
        border: 1px solid #666;
        border-radius: 10px;
        padding: 18px 22px;
        line-height: 1.7;
      }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        margin-top: -8px;
        pointer-events: none;
        z-index: 9;
      }

      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
      }

      #crosshair::before {
        left: 7px;
        top: 0;
        width: 2px;
        height: 16px;
      }

      #crosshair::after {
        top: 7px;
        left: 0;
        width: 16px;
        height: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <div id="hud">
      <div>分数: <span id="score">0</span></div>
      <div>命中: <span id="hits">0</span></div>
      <div>子弹: <span id="ammo">∞</span></div>
    </div>

    <div id="start-overlay">
      <div class="panel">
        点击开始（锁定鼠标）<br />
        鼠标：旋转视角 | WASD：移动<br />
        按住 Shift：冲刺 | 鼠标左键：开枪
      </div>
    </div>

    <div id="crosshair" aria-hidden="true"></div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
