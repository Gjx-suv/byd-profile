<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>The Pulse of Cycles</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      #scene {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #scene::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 52%, rgba(40, 82, 156, 0.22), rgba(0, 0, 0, 0.95) 60%);
        mix-blend-mode: screen;
      }

      .hint {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 5;
        padding: 10px 14px;
        border: 1px solid rgba(130, 176, 255, 0.34);
        border-radius: 999px;
        background: rgba(7, 9, 15, 0.52);
        color: rgba(219, 232, 255, 0.9);
        font-size: 12px;
        letter-spacing: 0.03em;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="hint">点击任意处开启音效，悬停球体切换乐符</div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
