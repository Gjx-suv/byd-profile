<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 简单3D行走游戏</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        text-align: center;
        padding: 20px;
        user-select: none;
        cursor: pointer;
      }

      #hint.hidden {
        display: none;
      }

      .panel {
        background: rgba(20, 20, 20, 0.9);
        border: 1px solid #666;
        border-radius: 10px;
        padding: 18px 22px;
        line-height: 1.7;
      }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        margin-top: -6px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        box-sizing: border-box;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <div id="hint">
      <div class="panel">
        <div id="hint-text">点击开始（锁定鼠标）</div>
        鼠标：看向四周<br />
        WASD：移动 | 空格：跳跃 | ESC：释放鼠标
      </div>
    </div>

    <div id="crosshair" aria-hidden="true"></div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
