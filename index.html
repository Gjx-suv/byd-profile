<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 简单3D行走游戏</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        text-align: center;
        padding: 20px;
        user-select: none;
        cursor: pointer;
      }

      #hint.hidden {
        display: none;
      }

      .panel {
        background: rgba(20, 20, 20, 0.9);
        border: 1px solid #666;
        border-radius: 10px;
        padding: 18px 22px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hint">
      <div class="panel">
        点击开始（锁定鼠标）<br />
        鼠标：看向四周<br />
        WASD：移动 | 空格：跳跃 | ESC：释放鼠标
      </div>
    </div>


    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="./game.js"></script>
  </body>
</html>
